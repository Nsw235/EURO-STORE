<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EURO STORE — Connexion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1220; --surface:#171C30; --surface-2:#1F2540; --line:#2E3556;
    --ink:#F2F0EA; --muted:#9AA2B8; --signal:#C9A24B; --signal-deep:#9C7A32;
    --signal-dim:rgba(201,162,75,.14); --danger:#FF5C6C; --danger-dim:rgba(255,92,108,.14);
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{width:100%; max-width:400px;}
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:36px; text-align:center;}
  .brand-logo{width:220px; height:auto; display:block;}
  .brand-slogan{color:var(--muted); font-size:13px; letter-spacing:.2px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px 26px 26px;}
  .card h2{font-family:'Space Grotesk'; font-size:18px; margin-bottom:6px;}
  .card p{color:var(--muted); font-size:13px; margin-bottom:22px;}

  .error{
    display:none; align-items:center; gap:8px; background:var(--danger-dim); color:var(--danger);
    border-radius:10px; padding:10px 13px; font-size:12.5px; margin-bottom:14px;
  }
  .error.show{display:flex;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:.5px;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
    padding:13px 14px; color:var(--ink); font-family:'Inter'; font-size:14.5px; outline:none;
  }
  .field input:focus{border-color:var(--signal);}

  .btn-go{
    width:100%; background:linear-gradient(180deg,var(--signal),var(--signal-deep));
    border:none; border-radius:14px; color:#241C08; font-family:'Space Grotesk'; font-weight:700;
    font-size:15px; padding:15px; cursor:pointer; margin-top:6px; transition:transform .12s ease, filter .12s ease;
  }
  .btn-go:active{transform:scale(.98); filter:brightness(.95);}
  .btn-go[disabled]{opacity:.6; cursor:not-allowed;}

  .status-line{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:22px; color:var(--muted); font-size:12px;}
  .status-line i{width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); display:inline-block;}
  .status-line.offline i{background:var(--danger); box-shadow:0 0 8px var(--danger);}
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">
      <img src="assets/logo-full-transparent.png" alt="EURO STORE" class="brand-logo">
      <div class="brand-slogan">La qualité européenne à votre portée</div>
    </div>

    <div class="card">
      <h2>Connexion</h2>
      <p>Connectez-vous avec votre adresse e-mail professionnelle.</p>
      <div class="error" id="loginError"><span>⚠</span><span></span></div>
      <div class="field">
        <label>Adresse e-mail</label>
        <input type="email" id="email" placeholder="vous@eurostore.fr" autocomplete="username">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-go" id="btnLogin">Se connecter</button>
    </div>

    <div class="status-line" id="statusLine"><i></i><span>Connecté</span></div>
  </div>

<script src="js/db.js"></script>
<script>
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const btnLogin = document.getElementById('btnLogin');
  const errBox = document.getElementById('loginError');

  function showError(msg) {
    errBox.querySelector('span:last-child').textContent = msg;
    errBox.classList.add('show');
  }

  async function attemptLogin() {
    errBox.classList.remove('show');
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { showError('Veuillez renseigner votre e-mail et votre mot de passe.'); return; }
    btnLogin.disabled = true;
    try {
      // The app resolves the account's role (admin / vendeur) silently —
      // it is never selected or shown on this screen.
      const session = await EuroStoreDB.Auth.login(email, password);
      window.location.href = session.role === 'admin' ? 'admin.html' : 'caisse.html';
    } catch (e) {
      showError(e.message);
      btnLogin.disabled = false;
    }
  }

  btnLogin.addEventListener('click', attemptLogin);
  [emailInput, passwordInput].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') attemptLogin();
  }));

  function updateStatus() {
    const line = document.getElementById('statusLine');
    if (navigator.onLine) { line.classList.remove('offline'); line.querySelector('span').textContent = 'Connecté'; }
    else { line.classList.add('offline'); line.querySelector('span').textContent = 'Hors ligne — mode local actif'; }
  }
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
