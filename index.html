<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EURO STORE — Connexion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171D; --surface:#1E222B; --surface-2:#262B36; --line:#323847;
    --ink:#F2F3F5; --muted:#8A93A6; --signal:#00E6A8; --signal-deep:#00B383;
    --signal-dim:rgba(0,230,168,.14); --danger:#FF5C6C; --danger-dim:rgba(255,92,108,.14);
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{width:100%; max-width:420px;}
  .brand{display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:36px; text-align:center;}
  .signal-mark{display:flex; align-items:flex-end; gap:4px; height:30px;}
  .signal-mark span{width:7px; background:var(--signal); border-radius:2px; display:block;}
  .signal-mark span:nth-child(1){height:35%;} .signal-mark span:nth-child(2){height:60%;}
  .signal-mark span:nth-child(3){height:82%;} .signal-mark span:nth-child(4){height:100%;}
  .brand-name{font-family:'Space Grotesk'; font-weight:700; font-size:26px; letter-spacing:.3px;}
  .brand-slogan{color:var(--muted); font-size:13px; letter-spacing:.2px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px; }
  .role-tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:14px; margin:8px;}
  .role-tab{flex:1; text-align:center; padding:12px; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;}
  .role-tab.active{background:var(--signal-dim); color:var(--signal);}

  .panel{padding:26px 24px 24px;}
  .panel h2{font-family:'Space Grotesk'; font-size:18px; margin-bottom:6px;}
  .panel p{color:var(--muted); font-size:13px; margin-bottom:22px;}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:7px; text-transform:uppercase; letter-spacing:.5px;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
    padding:13px 14px; color:var(--ink); font-family:'Inter'; font-size:14.5px; outline:none;
  }
  .field input:focus{border-color:var(--signal);}

  .btn-go{
    width:100%; background:linear-gradient(180deg,var(--signal),var(--signal-deep));
    border:none; border-radius:14px; color:#0A1410; font-family:'Space Grotesk'; font-weight:700;
    font-size:15px; padding:15px; cursor:pointer; margin-top:6px; transition:transform .12s ease, filter .12s ease;
  }
  .btn-go:active{transform:scale(.98); filter:brightness(.95);}

  .error{
    display:none; align-items:center; gap:8px; background:var(--danger-dim); color:var(--danger);
    border-radius:10px; padding:10px 13px; font-size:12.5px; margin-bottom:14px;
  }
  .error.show{display:flex;}

  .hint{margin-top:16px; text-align:center; color:var(--muted); font-size:11.5px;}
  .status-line{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:22px; color:var(--muted); font-size:12px;}
  .status-line i{width:7px; height:7px; border-radius:50%; background:var(--signal); box-shadow:0 0 8px var(--signal); display:inline-block;}
  .status-line.offline i{background:var(--danger); box-shadow:0 0 8px var(--danger);}
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">
      <div class="signal-mark"><span></span><span></span><span></span><span></span></div>
      <div>
        <div class="brand-name">EURO STORE</div>
        <div class="brand-slogan">La qualité européenne à votre portée</div>
      </div>
    </div>

    <div class="card">
      <div class="role-tabs">
        <div class="role-tab active" data-role="vendeur">Espace Vendeur</div>
        <div class="role-tab" data-role="admin">Administrateur</div>
      </div>

      <!-- Vendeur -->
      <div class="panel" id="panel-vendeur">
        <h2>Accès comptoir</h2>
        <p>Sélectionnez votre profil pour ouvrir la caisse.</p>
        <div class="error" id="err-vendeur"><span>⚠</span><span></span></div>
        <div class="field">
          <label>Prénom / initiales</label>
          <input type="text" id="vendeurName" placeholder="Ex. Sofia M." maxlength="40">
        </div>
        <button class="btn-go" id="btnVendeur">Ouvrir la caisse</button>
      </div>

      <!-- Admin -->
      <div class="panel" id="panel-admin" style="display:none;">
        <h2>Accès sécurisé</h2>
        <p>Réservé aux administrateurs de la boutique.</p>
        <div class="error" id="err-admin"><span>⚠</span><span></span></div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="adminPassword" placeholder="••••••••">
        </div>
        <button class="btn-go" id="btnAdmin">Se connecter</button>
        <div class="hint mono">Démo : admin123</div>
      </div>
    </div>

    <div class="status-line" id="statusLine"><i></i><span>Connecté</span></div>
  </div>

<script src="js/db.js"></script>
<script>
  const tabs = document.querySelectorAll('.role-tab');
  const panels = { vendeur: document.getElementById('panel-vendeur'), admin: document.getElementById('panel-admin') };
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    Object.values(panels).forEach(p => p.style.display = 'none');
    panels[t.dataset.role].style.display = 'block';
  }));

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.querySelector('span:last-child').textContent = msg;
    el.classList.add('show');
  }

  document.getElementById('btnVendeur').addEventListener('click', async () => {
    const name = document.getElementById('vendeurName').value.trim();
    const session = await EuroStoreDB.Auth.loginVendeur(name);
    window.location.href = 'caisse.html';
  });

  document.getElementById('btnAdmin').addEventListener('click', async () => {
    const pw = document.getElementById('adminPassword').value;
    document.getElementById('err-admin').classList.remove('show');
    try {
      await EuroStoreDB.Auth.loginAdmin(pw);
      window.location.href = 'admin.html';
    } catch (e) {
      showError('err-admin', e.message);
    }
  });
  document.getElementById('adminPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnAdmin').click();
  });

  function updateStatus() {
    const line = document.getElementById('statusLine');
    if (navigator.onLine) { line.classList.remove('offline'); line.querySelector('span').textContent = 'Connecté'; }
    else { line.classList.add('offline'); line.querySelector('span').textContent = 'Hors ligne — mode local actif'; }
  }
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);
  updateStatus();

  // Register service worker for PWA/offline support
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
